[project]
name = "kinoite-integration-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
]

[tool.uv]
package = false

# separate from the default "dev" group so `uv sync` in tests/Containerfile
# (used to build the actual test-runner image) doesn't pull these in
[dependency-groups]
lint = [
    "ruff>=0.9",
    "ty>=0.0.70",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"
